name: smartparking

services:
  # ---------- Persistencia ----------
  mongo:
    image: mongo:7
    ports: ["${MONGO_PORT:-27017}:27017"]
    volumes: [mongo-data:/data/db]
    networks: [internal]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=5", "-c", "hot_standby=on"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartparking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartparking}
      POSTGRES_DB: ${POSTGRES_DB:-smartparking}
      REPLICATION_USER: ${REPLICATION_USER:-replicator}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-replication.sh:/docker-entrypoint-initdb.d/10-init-replication.sh:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Réplica de lectura (streaming). Perfil opcional: docker compose --profile replica up -d
  # NOTA: definida pero no verificada en H0/H1.
  postgres-replica:
    image: postgres:16
    profiles: ["replica"]
    entrypoint: ["/bin/bash", "/replica-entrypoint.sh"]
    environment:
      PRIMARY_HOST: postgres
      REPLICATION_USER: ${REPLICATION_USER:-replicator}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator}
      POSTGRES_USER: ${POSTGRES_USER:-smartparking}
      POSTGRES_DB: ${POSTGRES_DB:-smartparking}
    ports: ["${POSTGRES_REPLICA_PORT:-5433}:5432"]
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
      - ./infra/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    # hostname fijo: los datos de mnesia dependen del nombre de nodo.
    # Solo se persiste mnesia (no .erlang.cookie), lo que evita el error eacces con volúmenes nuevos.
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes: [rabbitmq-data:/var/lib/rabbitmq/mnesia]
    networks: [internal]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["${ELASTICSEARCH_PORT:-9200}:9200"]
    volumes: [es-data:/usr/share/elasticsearch/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    profiles: ["observability"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports: ["${KIBANA_PORT:-5601}:5601"]
    depends_on:
      elasticsearch: { condition: service_healthy }
    networks: [internal]

  # ---------- Servicios de aplicación ----------
  identity-service:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    environment:
      PORT: 3001
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/identity}
      JWT_ISSUER: ${JWT_ISSUER:-smartparking-identity}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      JWT_PRIVATE_KEY_PATH: /run/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /run/keys/public.pem
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_CLIENT1_EMAIL: ${SEED_CLIENT1_EMAIL:-}
      SEED_CLIENT1_PASSWORD: ${SEED_CLIENT1_PASSWORD:-}
      SEED_CLIENT1_ID: ${SEED_CLIENT1_ID:-}
      SEED_CLIENT2_EMAIL: ${SEED_CLIENT2_EMAIL:-}
      SEED_CLIENT2_PASSWORD: ${SEED_CLIENT2_PASSWORD:-}
      SEED_CLIENT2_ID: ${SEED_CLIENT2_ID:-}
    volumes:
      - ./keys:/run/keys:ro
    # Puerto publicado solo para desarrollo: los clientes (SPA, k6, curl) acceden vía Nginx (:8080).
    ports: ["${IDENTITY_PORT:-3001}:3001"]
    depends_on:
      mongo: { condition: service_healthy }
    networks:
      internal:
        aliases: [identity]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Migraciones + seed en un servicio one-shot: evita la carrera entre las 2 réplicas de la API.
  api-migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: smartparking-api:local
    command: ["sh", "-c", "../node_modules/.bin/prisma migrate deploy && node dist/seed/run-seed.js"]
    environment: &api-env
      PORT: 3002
      DATABASE_URL: ${DATABASE_URL:-postgresql://smartparking:smartparking@postgres:5432/smartparking}
      DATABASE_REPLICA_URL: ${DATABASE_REPLICA_URL:-postgresql://smartparking:smartparking@postgres:5432/smartparking}
      IDENTITY_BASE_URL: ${IDENTITY_BASE_URL:-http://identity-service:3001}
      JWKS_URL: ${JWKS_URL:-http://identity-service:3001/.well-known/jwks.json}
      JWT_ISSUER: ${JWT_ISSUER:-smartparking-identity}
      AUDIT_PUBLISHER: ${AUDIT_PUBLISHER:-rabbitmq}
      AUDIT_EXCHANGE: ${AUDIT_EXCHANGE:-smartparking.events}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SEED_CLIENT1_EMAIL: ${SEED_CLIENT1_EMAIL:-}
      SEED_CLIENT1_ID: ${SEED_CLIENT1_ID:-}
      SEED_CLIENT2_EMAIL: ${SEED_CLIENT2_EMAIL:-}
      SEED_CLIENT2_ID: ${SEED_CLIENT2_ID:-}
    restart: "no"
    # los suscriptores deben haber declarado sus colas antes de que el seed publique eventos
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      audit-service: { condition: service_healthy }
      read-model-service: { condition: service_healthy }
    networks: [internal]

  # API: 2 réplicas detrás de Nginx (balanceo por DNS round-robin de Docker). Sin puerto publicado:
  # los clientes acceden por http://localhost:8080/api/... Para depurar una réplica suelta, usar
  # `docker compose exec api wget -qO- localhost:3002/health` o descomentar un puerto (solo con 1 réplica).
  api:
    image: smartparking-api:local
    command: ["node", "dist/server.js"]
    deploy:
      replicas: 2
    environment: *api-env
    # ports: ["${API_PORT:-3002}:3002"]   # solo desarrollo, con 1 réplica (deploy.replicas: 1)
    depends_on:
      api-migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      identity-service: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Punto de entrada único: http://localhost:8080  (/auth, /.well-known -> identity; /api -> api; / -> web)
  nginx:
    build:
      context: ./nginx
    ports: ["${NGINX_PORT:-8080}:80"]
    depends_on:
      - api
      - identity-service
      - web
      - read-model-service
    networks: [internal]
    restart: unless-stopped

  # Auditoría: suscriptor del exchange (cola audit-log, binding #) que persiste en Elasticsearch.
  audit-service:
    build:
      context: .
      dockerfile: audit-service/Dockerfile
    environment:
      PORT: 3003
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      AUDIT_INDEX: ${ES_INDEX:-audit-events}
      AUDIT_EXCHANGE: ${AUDIT_EXCHANGE:-smartparking.events}
      AUDIT_QUEUE: ${AUDIT_QUEUE:-audit-log}
      AUDIT_PREFETCH: ${AUDIT_PREFETCH:-20}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Solo desarrollo: GET /audit/events para consultar lo indexado.
    ports: ["${AUDIT_PORT:-3003}:3003"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # CQRS lado QUERY: segundo suscriptor del exchange (cola read-model.reservas) que proyecta en
  # MongoDB (base smartparking_read, separada de la de Identity). Vista derivada y reconstruible.
  read-model-service:
    build:
      context: .
      dockerfile: read-model-service/Dockerfile
    environment:
      PORT: 3004
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      READMODEL_EXCHANGE: ${AUDIT_EXCHANGE:-smartparking.events}
      READMODEL_QUEUE: ${READMODEL_QUEUE:-read-model.reservas}
      READMODEL_ROUTING_KEYS: ${READMODEL_ROUTING_KEYS:-reserva.*,vehiculo.*,cliente.*}
      READMODEL_MONGO_URL: ${READMODEL_MONGO_URL:-mongodb://mongo:27017}
      READMODEL_DB: ${READMODEL_DB:-smartparking_read}
      JWKS_URL: ${JWKS_URL:-http://identity-service:3001/.well-known/jwks.json}
      JWT_ISSUER: ${JWT_ISSUER:-smartparking-identity}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      identity-service: { condition: service_healthy }
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # SPA (React + Vite) servida por un Nginx interno en :80; sin puerto publicado (entrada: nginx :8080).
  web:
    build:
      context: ./web
    networks: [internal]
    restart: unless-stopped

networks:
  internal:

volumes:
  mongo-data:
  postgres-data:
  postgres-replica-data:
  redis-data:
  rabbitmq-data:
  es-data:
