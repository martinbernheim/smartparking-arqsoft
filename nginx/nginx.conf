# Nginx: reverse proxy + balanceador (A2: balanceo de carga, 2 réplicas de la API).
# Docker DNS devuelve las IPs de todas las réplicas de `api`; con `resolver` + variable en proxy_pass
# nginx re-resuelve cada 10 s y reparte round-robin entre ellas. Además, si un upstream no existe
# (p. ej. `web` todavía no desplegado) nginx arranca igual y responde 502 en esa ruta.
server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Compresión
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain text/xml image/svg+xml;

    # Timeouts razonables
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Reintenta en otra réplica ante fallo de conexión (apagar una réplica no corta el servicio).
    # Solo métodos idempotentes por defecto de nginx (no reintenta POST).
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;

    set $identity_upstream http://identity:3001;
    set $api_upstream      http://api:3002;
    set $readmodel_upstream http://read-model-service:3004;
    set $web_upstream      http://web:80;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Identity Service: login y JWKS
    location /auth/ {
        proxy_pass $identity_upstream;
    }
    location /.well-known/ {
        proxy_pass $identity_upstream;
    }

    # API (2 réplicas). X-Instance lo fija la API; se reexpone como X-Upstream-Instance.
    location /api/ {
        proxy_pass $api_upstream;
        add_header X-Upstream-Instance $upstream_http_x_instance always;
    }

    # Modelo de lectura CQRS (lado QUERY): resumen por cliente y ranking
    location /consultas/ {
        proxy_pass $readmodel_upstream;
    }

    # SPA
    location / {
        proxy_pass $web_upstream;
    }
}
